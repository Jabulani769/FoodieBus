# FoodieBus — Render Blueprint
# Apply via Render dashboard ("New" -> "Blueprint") or the Render CLI:
#   render blueprint launch
#
# What this provisions:
#   - Postgres + Redis (wired automatically into DATABASE_URL / REDIS_URL)
#   - The backend as a Docker web service (name "foodiebus" => https://foodiebus.onrender.com)
#   - The three dashboards as static sites, pointing at the backend
#
# The JWT secrets are auto-generated by Render (generateValue: true).
# Everything else is wired below; no manual secret entry is required.

databases:
  - name: foodiebus-db
    databaseName: foodiebus
    user: foodiebus
    plan: free
    postgresMajorVersion: 16

  - name: foodiebus-redis
    plan: free
    redisMajorVersion: 7

services:
  - type: web
    name: foodiebus
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodiebus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: foodiebus-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: mock

staticSites:
  - name: foodiebus-web-admin
    buildCommand: >-
      npm install &&
      npm run build --workspace=@foodiebus/types
      --workspace=@foodiebus/api-client
      --workspace=@foodiebus/auth
      --workspace=@foodiebus/ui
      --workspace=@foodiebus/web-admin
    staticPublishPath: ./apps/web-admin/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://foodiebus.onrender.com/api/v1
      - key: VITE_WS_URL
        value: https://foodiebus.onrender.com

  - name: foodiebus-web-vendor
    buildCommand: >-
      npm install &&
      npm run build --workspace=@foodiebus/types
      --workspace=@foodiebus/api-client
      --workspace=@foodiebus/auth
      --workspace=@foodiebus/ui
      --workspace=@foodiebus/web-vendor
    staticPublishPath: ./apps/web-vendor/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://foodiebus.onrender.com/api/v1
      - key: VITE_WS_URL
        value: https://foodiebus.onrender.com

  - name: foodiebus-web-financial
    buildCommand: >-
      npm install &&
      npm run build --workspace=@foodiebus/types
      --workspace=@foodiebus/api-client
      --workspace=@foodiebus/auth
      --workspace=@foodiebus/ui
      --workspace=@foodiebus/web-financial
    staticPublishPath: ./apps/web-financial/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://foodiebus.onrender.com/api/v1
      - key: VITE_WS_URL
        value: https://foodiebus.onrender.com
