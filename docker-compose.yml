services:
  postgres:
    image: postgres:16-alpine
    container_name: foodiebus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodiebus
      POSTGRES_USER: foodiebus
      POSTGRES_PASSWORD: foodiebus_dev
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodiebus -d foodiebus']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foodiebus-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  redis_data:
